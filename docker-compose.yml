services:
  # Voice interface (headless with xvfb)
  voice:
    build: .
    container_name: neuralsight-voice
    env_file:
      - .env
    environment:
      - GROQ_WHISPER_MODEL=${GROQ_WHISPER_MODEL:-whisper-large-v3-turbo}
    volumes:
      - ./.env:/app/.env:ro
    stdin_open: true
    tty: true
    network_mode: host
    command: >
      bash -c "
        Xvfb :99 -screen 0 1920x1080x24 &
        export DISPLAY=:99
        cd /app/openclaude
        bun run dev:grpc &
        sleep 5
        python voice_terminal_pipeline.py
      "

  # Eye calibration only
  calibrate:
    build: .
    container_name: neuralsight-calibrate
    env_file:
      - .env
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - ./.env:/app/.env:ro
    stdin_open: true
    tty: true
    network_mode: host
    command: python Eye-Tracker/calibrate.py

  # Eye tracking only
  track:
    build: .
    container_name: neuralsight-track
    env_file:
      - .env
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - ./.env:/app/.env:ro
    stdin_open: true
    tty: true
    network_mode: host
    command: python Eye-Tracker/track.py