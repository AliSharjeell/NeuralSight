services:
  # Eye calibration only
  calibrate:
    build: .
    container_name: neuralsight-calibrate
    env_file:
      - .env
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - ./.env:/app/.env:ro
    stdin_open: true
    tty: true
    network_mode: host
    command: python Eye-Tracker/calibrate.py

  # Eye tracking only
  track:
    build: .
    container_name: neuralsight-track
    env_file:
      - .env
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - ./.env:/app/.env:ro
    stdin_open: true
    tty: true
    network_mode: host
    command: python Eye-Tracker/track.py